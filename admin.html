<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1512">
<title>Painel · Señor X</title>
<style>
:root{--laranja:#CF7132;--laranja-esc:#b45f27;--fundo:#1B1512;--creme:#F1E4D3;--bg:#f4f0ea;--card:#fff;--borda:#e4ddd3;--txt:#2a2420;--sub:#7a6f66;--ok:#2e7d32;--erro:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.oculto{display:none!important}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--fundo)}
.login form{width:100%;max-width:360px;background:#241c18;border:1px solid #3a2d25;border-radius:18px;padding:28px 22px;color:var(--creme)}
.login svg{width:92px;display:block;margin:0 auto 10px;color:var(--laranja)}
.login h1{font:700 20px Georgia,serif;text-align:center;margin:0 0 20px}
.login label{display:block;font-size:13px;color:#cbbba9;margin:12px 0 6px}
.login input{width:100%;padding:12px;border-radius:10px;border:1px solid #4a3a30;background:#1B1512;color:var(--creme);font-size:16px}
.login button.pri{margin-top:20px;width:100%}
.login .link{background:none;border:0;color:#E89356;margin-top:14px;width:100%;cursor:pointer;font-size:14px}
.login .msg{margin-top:12px;font-size:14px;min-height:20px;text-align:center}
.login .msg.erro{color:#ff9a8f}.login .msg.ok{color:#9fd8a3}
/* topo */
.topo{position:sticky;top:0;z-index:20;background:var(--fundo);color:var(--creme);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.topo .l1{display:flex;align-items:center;gap:10px}
.topo svg{width:30px;height:36px;color:var(--laranja);flex:none}
.topo h1{font:700 17px Georgia,serif;margin:0;flex:1}
.topo a,.topo button.sair{color:#E89356;font-size:13px;text-decoration:none;background:none;border:1px solid #5a4a3f;border-radius:20px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.abas{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:1;border:0;background:transparent;color:#cbbba9;padding:11px 8px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.abas button.on{color:#fff;border-bottom-color:var(--laranja)}
main{max-width:720px;margin:0 auto;padding:14px 12px 90px}
.status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fundo);color:var(--creme);padding:9px 16px;border-radius:22px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .25s;opacity:0;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.status.on{opacity:1}
.status.erro{background:var(--erro);color:#fff}
/* botões e campos */
.btn{border:1px solid var(--borda);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri,button.pri{background:var(--laranja);border:1px solid var(--laranja);color:#fff;font-weight:700;border-radius:12px;padding:12px 16px;cursor:pointer}
.btn.pri:hover{background:var(--laranja-esc)}
.btn.perigo{color:var(--erro)}
.btn.perigo.confirmar{background:var(--erro);color:#fff;border-color:var(--erro)}
.btn.add{width:100%;border-style:dashed;color:var(--laranja);font-weight:700;margin-top:10px;padding:12px}
.ico{border:0;background:none;width:36px;height:36px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:17px;flex:none}
.ico:hover{background:#f1ebe3}
label.l{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px;font-weight:600}
.t{width:100%;border:1px solid var(--borda);border-radius:10px;padding:10px 11px;background:#fff;font-size:16px}
.t:focus{outline:2px solid rgba(207,113,50,.35);border-color:var(--laranja)}
textarea.t{resize:vertical;min-height:44px}
.lin{display:flex;gap:8px}.lin>*{flex:1;min-width:0}
.dica{font-size:12.5px;color:var(--sub);line-height:1.45;margin:6px 0 0}
.busca{position:sticky;top:96px;z-index:5;background:var(--bg);padding:2px 0 10px}
/* cartões */
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card>.cab{display:flex;align-items:center;gap:8px;padding:14px;cursor:pointer;user-select:none}
.card>.cab .tit{flex:1;font-weight:700;font-size:16px}
.card>.cab .qt{font-size:12.5px;color:var(--sub);background:#f3efe9;border-radius:20px;padding:3px 9px}
.card>.cab .seta{color:var(--sub);transition:transform .15s}
.card.aberto>.cab .seta{transform:rotate(90deg)}
.card>.corpo{display:none;border-top:1px solid var(--borda);padding:4px 12px 14px}
.card.aberto>.corpo{display:block}
.pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 8px;background:#fbe3c4;color:#7a4a12}
.pill.cinza{background:#eee;color:#666}
/* item */
.it{border-bottom:1px solid #f0ebe4;padding:10px 0}
.it:last-of-type{border-bottom:0}
.it .linha{display:flex;align-items:center;gap:8px}
.it .nome{flex:1;min-width:0;cursor:pointer}
.it .nome b{display:block;font-size:15px;line-height:1.25}
.it .nome span{font-size:13px;color:var(--sub)}
.it.indisp .nome b{text-decoration:line-through;color:var(--sub)}
.it .edit{display:none;padding:6px 0 4px}
.it.aberto .edit{display:block}
.precos{display:flex;gap:8px;flex-wrap:wrap}
.precos .pbox{display:flex;align-items:center;border:1px solid var(--borda);border-radius:10px;background:#fff;overflow:hidden;flex:1;min-width:140px}
.precos .pbox span{padding:0 8px;color:var(--sub);font-size:13px}
.precos .pbox input{border:0;padding:10px 4px;width:100%;min-width:0;outline:none;font-size:16px}
.precos .pbox input.rot{border-left:1px solid var(--borda);max-width:80px;font-size:14px;color:var(--sub);padding-left:8px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
/* interruptor */
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d6cfc6;border-radius:28px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(20px)}
.swl{font-size:11px;color:var(--sub);text-align:center;width:56px;flex:none;line-height:1.1}
/* promoções */
.promo{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:10px}
.promo.inativa{opacity:.6}
.promo .cab{display:flex;align-items:center;gap:10px}
.promo h3{margin:0;font-size:16px;flex:1}
.promo .info{font-size:13px;color:var(--sub);margin-top:4px}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dias label{display:flex;align-items:center;justify-content:center;width:44px;height:38px;border:1px solid var(--borda);border-radius:10px;background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.dias input{display:none}
.dias label:has(input:checked){background:var(--laranja);color:#fff;border-color:var(--laranja)}
.vazio{text-align:center;color:var(--sub);padding:30px 10px}
.carregando{text-align:center;color:var(--sub);padding:50px}

/* indicadores */
.per{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.per button{border:1px solid var(--borda);background:#fff;border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer}
.per button.on{background:var(--fundo);color:#fff;border-color:var(--fundo)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px}
.kpi .k{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .v{font:700 30px Georgia,serif;margin:4px 0 2px;color:var(--txt)}
.kpi .v small{font:500 14px -apple-system,sans-serif;color:var(--sub)}
.kpi .s{font-size:12.5px;font-weight:700}
.s.bom{color:#1d6b2a}.s.atencao{color:#8a5a00}.s.ruim{color:#b3261e}.s.nd{color:var(--sub);font-weight:500}
.jorn{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin:10px 0 6px}
.jorn div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;min-width:28px;cursor:default}
.jleg{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;color:var(--txt)}
.jleg span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.horas{display:flex;align-items:flex-end;gap:3px;height:120px;margin:12px 0 4px;border-bottom:1px solid var(--borda)}
.horas div{flex:1;background:var(--laranja);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.horas div:hover{background:#a8541f}
.hlab{display:flex;gap:3px;font-size:11px;color:var(--sub)}.hlab span{flex:1;text-align:center}
.tab{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tab td,.tab th{padding:7px 4px;border-top:1px solid #f0ebe4;text-align:left}.tab th{font-size:12px;color:var(--sub);font-weight:600}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>

      ${simples?"":`<button class="btn" style="margin-top:8px" data-c="${dois?"umPreco":"doisPrecos"}">${dois?"− Voltar para 1 preço":"+ Segundo preço (tamanho)"}</button>

      <label class="l">Selo</label><select class="t" data-f="selo">${Object.entries(SELOS).map(([k,v])=>`<option value="${k}"${k===(i.selo||"")?" selected":""}>${v}</option>`).join("")}</select>`}
      <div class="acoes">
        <button class="btn" data-c="subir">↑ Subir</button><button class="btn" data-c="descer">↓ Descer</button>
        <span style="flex:1"></span>
        <button class="btn perigo" data-c="excluir">Excluir</button>
      </div>
    </div>
  </div>`;
}
function renderSecoes(){
  const q=semAc($("busca").value.trim());
  const html=SEC.map(s=>{
    const itens=q?s.itens.filter(i=>semAc(i.nome+" "+i.descricao).includes(q)):s.itens;
    if(q&&!itens.length) return "";
    const ab=abertos.has(s.id)||!!q, esg=s.itens.filter(i=>i.oculto).length;
    let corpo="";
    if(s.tipo==="listas"){
      corpo=`<label class="l">Preço único</label><div class="precos"><div class="pbox"><span>R$</span><input data-sf="preco" inputmode="decimal" value="${esc(precoEd(s.preco))}"></div></div>
        ${(s.listas||[]).map((l,k)=>`<label class="l">${esc(l.titulo)} (uma por linha)</label><textarea class="t" rows="5" data-sf="lista" data-k="${k}">${esc((l.opcoes||[]).join("\n"))}</textarea>`).join("")}
        <label class="l">Nota</label><input class="t" data-sf="nota" value="${esc(s.nota)}">`;
    } else {
      corpo=itens.map(i=>htmlItem(s,i)).join("")+(q?"":`<button class="btn add" data-c="novoItem">+ Adicionar item em ${esc(s.titulo)}</button>`);
    }
    corpo+=q?"":`<details style="margin-top:12px"><summary class="dica" style="cursor:pointer">Opções da seção</summary>
      <label class="l">Título da seção</label><input class="t" data-sf="titulo" value="${esc(s.titulo)}">
      ${s.tipo!=="quadro"||true?`<label class="l">Os pedidos desta seção vão para</label><select class="t" data-sf="destino"><option value="cozinha"${s.destino!=="bar"?" selected":""}>🍳 Cozinha</option><option value="bar"${s.destino==="bar"?" selected":""}>🍹 Bar (não aparece na tela da cozinha)</option></select>`:""}
      <label class="l" style="display:flex;align-items:center;gap:10px">Mostrar seção no cardápio online <label class="sw"><input type="checkbox" data-sf="ativo"${s.ativo?" checked":""}><span></span></label></label></details>`;
    return `<section class="card${ab?" aberto":""}" data-s="${s.id}">
      <div class="cab" data-c="abrirSec"><span class="seta">▶</span><span class="tit">${esc(s.titulo)}</span>
        ${!s.ativo?`<span class="pill cinza">oculta</span>`:""}${esg?`<span class="pill">${esg} esgotado${esg>1?"s":""}</span>`:""}
        <span class="qt">${s.tipo==="listas"?"lista":s.itens.length}</span></div>
      <div class="corpo">${corpo}</div></section>`;
  }).join("");
  $("listaSecoes").innerHTML=html||`<div class="vazio">Nada encontrado.</div>`;
}
$("busca").addEventListener("input",renderSecoes);

$("listaSecoes").addEventListener("click",async e=>{
  const b=e.target.closest("[data-c]"); if(!b) return;
  const cardEl=b.closest(".card"), s=acharSec(cardEl?.dataset.s), itEl=b.closest(".it"), i=itEl?acharIt(s.id,itEl.dataset.i):null;
  switch(b.dataset.c){
    case "abrirSec": abertos.has(s.id)?abertos.delete(s.id):abertos.add(s.id); cardEl.classList.toggle("aberto"); return;
    case "abrirItem": itensAbertos.has(i.id)?itensAbertos.delete(i.id):itensAbertos.add(i.id); itEl.classList.toggle("aberto"); return;
    case "doisPrecos": i.precos.push({valor:null,rotulo:""}); if(!i.precos[0].rotulo) i.precos[0].rotulo=""; salvarDepois("itens",i.id,{precos:i.precos},0); renderSecoes(); return;
    case "umPreco": i.precos=[{valor:i.precos[0].valor,rotulo:""}]; salvarDepois("itens",i.id,{precos:i.precos},0); renderSecoes(); return;
    case "subir": case "descer": {
      const k=s.itens.indexOf(i), j=k+(b.dataset.c==="subir"?-1:1); if(j<0||j>=s.itens.length) return;
      [s.itens[k],s.itens[j]]=[s.itens[j],s.itens[k]];
      s.itens.forEach((x,n)=>x.ordem=n);
      renderSecoes(); status("Salvando…",false,4000);
      const r=await Promise.all([s.itens[k],s.itens[j]].map(x=>sb.from("itens").update({ordem:x.ordem}).eq("id",x.id)));
      const er=r.find(x=>x.error); er?status(erroMsg(er.error),true):status("Ordem salva ✓"); return;
    }
    case "excluir":
      if(!b.classList.contains("confirmar")){ b.classList.add("confirmar"); b.textContent="Toque de novo para excluir"; setTimeout(()=>{b.classList.remove("confirmar");b.textContent="Excluir";},4000); return; }
      { const {error}=await sb.from("itens").delete().eq("id",i.id);
        if(error){ status(erroMsg(error),true); return; }
        s.itens=s.itens.filter(x=>x!==i); renderSecoes(); status("Item excluído"); }
      return;
    case "novoItem": {
      const novo={secao_id:s.id,nome:"Novo item",descricao:"",obs:"",selo:"",oculto:false,precos:[{valor:null,rotulo:""}],ordem:s.itens.length};
      status("Criando…",false,4000);
      const {data,error}=await sb.from("itens").insert(novo).select().single();
      if(error){ status(erroMsg(error),true); return; }
      s.itens.push(data); itensAbertos.add(data.id); renderSecoes(); status("Item criado: preencha os dados");
      setTimeout(()=>{ const el=document.querySelector(`.it[data-i="${data.id}"] [data-f="nome"]`); if(el){ el.scrollIntoView({block:"center"}); el.focus(); el.select(); } },50);
      return;
    }
  }
});
$("listaSecoes").addEventListener("input",e=>{
  const el=e.target, cardEl=el.closest(".card"); if(!cardEl) return;
  const s=acharSec(cardEl.dataset.s);
  if(el.dataset.sf){
    const f=el.dataset.sf;
    if(f==="titulo"){ s.titulo=el.value; cardEl.querySelector(".cab .tit").textContent=el.value; salvarDepois("secoes",s.id,{titulo:s.titulo}); }
    if(f==="preco"){ s.preco=lerPreco(el.value); salvarDepois("secoes",s.id,{preco:s.preco}); }
    if(f==="nota"){ s.nota=el.value; salvarDepois("secoes",s.id,{nota:s.nota}); }
    if(f==="lista"){ s.listas[+el.dataset.k].opcoes=el.value.split("\n").map(x=>x.trim()).filter(Boolean); salvarDepois("secoes",s.id,{listas:s.listas}); }
    return;
  }
  const itEl=el.closest(".it"); if(!itEl||!el.dataset.f) return;
  const i=acharIt(s.id,itEl.dataset.i), f=el.dataset.f;
  if(f==="disp") return; // tratado no change
  if(f==="preco"){ i.precos[+el.dataset.k].valor=lerPreco(el.value); salvarDepois("itens",i.id,{precos:i.precos}); }
  else if(f==="rotulo"){ i.precos[+el.dataset.k].rotulo=el.value; salvarDepois("itens",i.id,{precos:i.precos}); }
  else { i[f]=el.value; salvarDepois("itens",i.id,{[f]:el.value}); }
  if(f==="nome"||f==="preco"||f==="rotulo"||f==="selo"){
    const resumo=i.precos.map(p=>brl(p.valor)+(p.rotulo?" ("+p.rotulo+")":"")).join(" · ");
    itEl.querySelector(".nome b").textContent=i.nome||"(sem nome)";
    itEl.querySelector(".nome span").textContent=resumo+(i.selo?" · "+(SELOS[i.selo]||""):"");
  }
});
$("listaSecoes").addEventListener("change",e=>{
  const el=e.target, cardEl=el.closest(".card"); if(!cardEl) return;
  const s=acharSec(cardEl.dataset.s);
  if(el.dataset.sf==="destino"){ s.destino=el.value; salvarDepois("secoes",s.id,{destino:s.destino},0); return; }
  if(el.dataset.sf==="ativo"){ s.ativo=el.checked; salvarDepois("secoes",s.id,{ativo:s.ativo},0); renderSecoes(); return; }
  if(el.dataset.f==="disp"){
    const itEl=el.closest(".it"), i=acharIt(s.id,itEl.dataset.i);
    i.oculto=!el.checked; itEl.classList.toggle("indisp",i.oculto);
    itEl.querySelector(".swl").textContent=i.oculto?"esgotado":"disponível";
    salvarDepois("itens",i.id,{oculto:i.oculto},0);
    status(i.oculto?`“${i.nome}” marcado como esgotado`:`“${i.nome}” disponível de novo`);
  }
});

/* ---------- promoções ---------- */
let promoEditando=null;
function formPromo(p){
  p=p||{titulo:"",descricao:"",preco:null,preco_de:null,dias_semana:[],inicio:null,fim:null,ativo:true};
  return `<div class="promo" id="formPromo">
    <b>${p.id?"Editar promoção":"Nova promoção"}</b>
    <label class="l">Título</label><input class="t" id="pTit" value="${esc(p.titulo)}" placeholder="ex: Terça do Brasil">
    <label class="l">Descrição</label><textarea class="t" id="pDesc" rows="2" placeholder="ex: Hambúrguer Brasil + fritas + refri lata">${esc(p.descricao)}</textarea>
    <div class="lin">
      <div><label class="l">Preço promocional</label><div class="precos"><div class="pbox"><span>R$</span><input id="pPreco" inputmode="decimal" value="${esc(precoEd(p.preco))}"></div></div></div>
      <div><label class="l">Preço normal (riscado)</label><div class="precos"><div class="pbox"><span>R$</span><input id="pDe" inputmode="decimal" value="${esc(precoEd(p.preco_de))}" placeholder="opcional"></div></div></div>
    </div>
    <label class="l">Dias da semana</label>
    <div class="dias">${DIAS.map((d,k)=>`<label><input type="checkbox" value="${k}"${(p.dias_semana||[]).includes(k)?" checked":""}>${d}</label>`).join("")}</div>
    <p class="dica">Sem nenhum dia marcado, vale todos os dias.</p>
    <div class="lin">
      <div><label class="l">Começa em (opcional)</label><input class="t" type="date" id="pIni" value="${esc(p.inicio||"")}"></div>
      <div><label class="l">Termina em (opcional)</label><input class="t" type="date" id="pFim" value="${esc(p.fim||"")}"></div>
    </div>
    <div class="acoes"><button class="btn pri" id="pSalvar">Salvar promoção</button><button class="btn" id="pCancelar">Cancelar</button></div>
  </div>`;
}
function resumoPromo(p){
  const partes=[];
  if(p.preco!=null) partes.push((p.preco_de!=null?"de "+brl(p.preco_de)+" por ":"")+brl(p.preco));
  partes.push(p.dias_semana&&p.dias_semana.length&&p.dias_semana.length<7?p.dias_semana.slice().sort().map(k=>DIAS[k]).join(", "):"todos os dias");
  if(p.inicio||p.fim) partes.push((p.inicio?"de "+p.inicio.split("-").reverse().join("/"):"")+(p.fim?" até "+p.fim.split("-").reverse().join("/"):""));
  return partes.join(" · ");
}
function renderPromos(){
  const hoje=new Date().toISOString().slice(0,10);
  $("abaPromos").innerHTML=`
    <p class="dica" style="margin:0 0 12px">As promoções ativas aparecem no topo do cardápio online, só nos dias e datas escolhidos.</p>
    ${promoEditando==="nova"?formPromo():`<button class="btn add" id="pNova" style="margin:0 0 12px">+ Nova promoção</button>`}
    ${PROMOS.length?PROMOS.map(p=>promoEditando===p.id?formPromo(p):`<div class="promo${p.ativo?"":" inativa"}" data-p="${p.id}">
      <div class="cab"><h3>${esc(p.titulo)}</h3><label class="sw" title="Ativa"><input type="checkbox" data-pf="ativo"${p.ativo?" checked":""}><span></span></label></div>
      ${p.descricao?`<div class="info">${esc(p.descricao)}</div>`:""}
      <div class="info"><b>${esc(resumoPromo(p))}</b>${p.fim&&p.fim<hoje?' · <span style="color:var(--erro)">vencida</span>':""}</div>
      <div class="acoes"><button class="btn" data-pc="editar">Editar</button><span style="flex:1"></span><button class="btn perigo" data-pc="excluir">Excluir</button></div>
    </div>`).join(""):(promoEditando?"":`<div class="vazio">Nenhuma promoção ainda.</div>`)}`;
}
$("abaPromos").addEventListener("click",async e=>{
  const t=e.target;
  if(t.id==="pNova"){ promoEditando="nova"; renderPromos(); $("pTit").focus(); return; }
  if(t.id==="pCancelar"){ promoEditando=null; renderPromos(); return; }
  if(t.id==="pSalvar"){
    const reg={titulo:$("pTit").value.trim(),descricao:$("pDesc").value.trim(),preco:lerPreco($("pPreco").value),preco_de:lerPreco($("pDe").value),
      dias_semana:[...document.querySelectorAll("#formPromo .dias input:checked")].map(x=>+x.value),inicio:$("pIni").value||null,fim:$("pFim").value||null};
    if(!reg.titulo){ status("Dê um título para a promoção.",true); return; }
    if(reg.inicio&&reg.fim&&reg.fim<reg.inicio){ status("A data final está antes da inicial.",true); return; }
    t.disabled=true; status("Salvando…",false,4000);
    const r=promoEditando==="nova"? await sb.from("promocoes").insert({...reg,ativo:true,ordem:PROMOS.length}).select().single()
                                  : await sb.from("promocoes").update(reg).eq("id",promoEditando).select().single();
    t.disabled=false;
    if(r.error){ status(erroMsg(r.error),true); return; }
    if(promoEditando==="nova") PROMOS.push(r.data); else PROMOS=PROMOS.map(p=>p.id===r.data.id?r.data:p);
    promoEditando=null; renderPromos(); status("Promoção salva ✓"); return;
  }
  const b=t.closest("[data-pc]"); if(!b) return;
  const id=b.closest("[data-p]").dataset.p;
  if(b.dataset.pc==="editar"){ promoEditando=id; renderPromos(); return; }
  if(b.dataset.pc==="excluir"){
    if(!b.classList.contains("confirmar")){ b.classList.add("confirmar"); b.textContent="Toque de novo para excluir"; setTimeout(()=>{b.classList.remove("confirmar");b.textContent="Excluir";},4000); return; }
    const {error}=await sb.from("promocoes").delete().eq("id",id);
    if(error){ status(erroMsg(error),true); return; }
    PROMOS=PROMOS.filter(p=>p.id!==id); renderPromos(); status("Promoção excluída");
  }
});
$("abaPromos").addEventListener("change",e=>{
  if(e.target.dataset.pf!=="ativo") return;
  const id=e.target.closest("[data-p]").dataset.p, p=PROMOS.find(x=>x.id===id);
  p.ativo=e.target.checked; e.target.closest(".promo").classList.toggle("inativa",!p.ativo);
  salvarDepois("promocoes",id,{ativo:p.ativo},0);
});

function situacaoCozinha(c){

let perInd="hoje";
function faixaInd(p){
  const d=new Date(); d.setHours(6,0,0,0); if(new Date().getHours()<6) d.setDate(d.getDate()-1);
  const ini=new Date(d), fim=new Date(d.getTime()+86400000);
  if(p==="ontem"){ ini.setDate(ini.getDate()-1); fim.setDate(fim.getDate()-1); }
  if(p==="7"){ ini.setDate(ini.getDate()-6); }
  if(p==="30"){ ini.setDate(ini.getDate()-29); }
  return [ini.toISOString(),fim.toISOString()];
}
const minF=v=>v==null?"—":(v<1?"<1":String(Math.round(v*10)/10).replace(".",","));
function selo(pct){ if(pct==null) return `<span class="s nd">sem dados ainda</span>`; const c=pct>=80?"bom":pct>=50?"atencao":"ruim", i=pct>=80?"✓":pct>=50?"!":"✕"; return `<span class="s ${c}">${i} ${pct}% dentro da meta</span>`; }
function jornada(etapas){
  const tot=etapas.reduce((s,e)=>s+(e.v||0),0);
  if(!tot) return `<p class="dica">Sem pedidos completos neste período.</p>`;
  const cores=["#D9A13B","#CF5F2E","#8E3F18","#1C80AB"];
  return `<div class="jorn">${etapas.map((e,k)=>e.v?`<div style="flex:${e.v};background:${cores[k]};color:${k<1?"#3a2405":"#fff"}" title="${e.n}: ${minF(e.v)} min">${minF(e.v)}</div>`:"").join("")}</div>
    <div class="jleg">${etapas.map((e,k)=>`<span><i style="background:${cores[k]}"></i>${e.n}: <b>${minF(e.v)} min</b></span>`).join("")}</div>`;
}

function qrSvgAdmin(texto){
  const q=qrcode(0,"M"); q.addData(unescape(encodeURIComponent(texto))); q.make(); const n=q.getModuleCount(); let d="";
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) d+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" style="width:100%;height:100%;display:block"><path fill="#1B1512" d="${d}"/></svg>`;
}

async function carregarVendas(){

    sb.from("comandas").select("*").eq("status","fechada").gte("fechada_em",ini.toISOString()).lt("fechada_em",fim.toISOString()).order("fechada_em",{ascending:false}),
    sb.from("comandas").select("*, pedidos(id,status), pedido_itens(nome,rotulo,obs,preco,qtd,cancelado,pedido_id)").eq("status","aberta").order("mesa")
  ]);

  const L=fech.data, porForma={}; let tot=0, taxa=0;

  ABERTAS_V=(abert.data||[]);

  const hora=s=>new Date(s).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

    </div>
    ${ab.length?`<div class="promo"><b>Abertas agora (mesas e delivery)</b>${ab.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #f0ebe4"><span>${rotuloComanda(c)} · desde ${hora(c.aberta_em)}</span><span style="display:flex;gap:8px;align-items:center"><b>${brl(c.parcial)}</b><button class="btn" style="padding:5px 9px" data-imp="${c.id}">🖨️</button></span></div>`).join("")}<div style="margin-top:10px">${escolherPapelHtml()}</div></div>`:""}
    <div class="promo"><b>Contas fechadas</b>${L.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #f0ebe4"><span>${hora(c.fechada_em)} · ${rotuloComanda(c)} · ${esc(c.forma_pagamento||"")}</span><b>${brl(c.total)}</b></div>`).join("")||`<p class="dica">Nenhuma conta fechada neste dia.</p>`}</div>`;
}

function imprimirComanda(c,itensSrc){
  const itens=(itensSrc||c.pedido_itens||[]).filter(i=>!i.cancelado);
  const ag=[]; itens.forEach(i=>{ const k=i.nome+"|"+(i.rotulo||"")+"|"+i.preco+"|"+(c.tipo==="mesa"?"":(i.obs||"")); const x=ag.find(y=>y.k===k); if(x) x.qtd+=i.qtd; else ag.push({k,qtd:i.qtd,nome:i.nome,rotulo:i.rotulo,preco:i.preco,obs:c.tipo==="mesa"?"":i.obs}); });
  const sub=ag.reduce((s,i)=>s+i.preco*i.qtd,0);
  if(c.tipo==="mesa"){
    const taxa=Math.round(sub*10)/100;
    imprimirConta({titulo:"CONTA · MESA "+c.mesa,sub:["Aberta às "+new Date(c.aberta_em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})],itens:ag,linhas:[["Consumo",brl(sub)],["Serviço (10%) opcional",brl(taxa)]],total:sub+taxa,rodape:REST.pix_chave?["Pix: "+REST.pix_chave]:[],rest:REST});
  } else {
    const tx=+c.taxa_entrega||0, tot=sub+tx, ent=c.tipo==="delivery";
    const PG={pix:"Pix",dinheiro:"Dinheiro",cartao:"Cartão"};
    const rod=[`Pagamento: ${PG[c.forma_pagamento]||c.forma_pagamento||""}${c.pagamento_status==="pago"?" (PAGO)":""}`];
    if(c.troco_para) rod.push(`Troco para ${brl(c.troco_para)}: levar ${brl(c.troco_para-tot)}`);
    if(c.obs_cliente) rod.push("Obs: "+c.obs_cliente);
    imprimirConta({titulo:(ent?"ENTREGA":"RETIRADA")+" · "+(c.codigo||""),sub:[c.cliente_nome||"",c.cliente_telefone||"",...(ent?[c.endereco||"",c.bairro_nome||""]:[])].filter(Boolean),
      itens:ag,linhas:[["Subtotal",brl(sub)],...(ent?[["Entrega",brl(tx)]]:[])],total:tot,rodape:rod,rest:REST});
  }
}

function escolherPapelHtml(){ const p=papel(); return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px"><span>Papel da impressora:</span>${[["80","Térmica 80mm"],["58","Térmica 58mm"],["a4","Comum (A4)"]].map(([v,n])=>`<button type="button" data-papel="${v}" style="border:1px solid #ccc;border-radius:16px;padding:5px 10px;background:${p===v?"#1B1512":"#fff"};color:${p===v?"#fff":"#222"};cursor:pointer">${n}</button>`).join("")}</div>`; }
document.addEventListener("click",ev=>{ const b=ev.target.closest("[data-papel]"); if(!b) return; setPapel(b.dataset.papel); b.parentElement.querySelectorAll("[data-papel]").forEach(x=>{ const on=x===b; x.style.background=on?"#1B1512":"#fff"; x.style.color=on?"#fff":"#222"; }); });
