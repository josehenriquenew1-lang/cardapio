<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<title>Cozinha · Señor X</title>
<style>
:root{--laranja:#CF7132;--fundo:#120e0c;--card:#221a16;--borda:#3a2d25;--creme:#F1E4D3;--sub:#a8998a;--ok:#3fa34d;--amarelo:#f2b632;--vermelho:#e0533f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--creme);overflow:hidden}
button,input,select{font:inherit;color:inherit}
.oculto{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:28px 22px}
.login svg{width:84px;display:block;margin:0 auto 10px;color:var(--laranja)}
.login h1{font:700 22px Georgia,serif;text-align:center;margin:0 0 18px}
.login label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
.login input{width:100%;padding:13px;border-radius:10px;border:1px solid #4a3a30;background:var(--fundo);color:var(--creme);font-size:16px}
.btn{border:1px solid var(--borda);background:#2d231e;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700}
.btn.pri{background:var(--laranja);border-color:var(--laranja);color:#fff}
.msg{margin-top:12px;font-size:14px;min-height:20px;text-align:center;color:#ff9a8f}
/* topo */
.topo{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--borda);background:#1a1411}
.topo svg{width:30px;height:36px;color:var(--laranja)}
.topo h1{font:700 20px Georgia,serif;margin:0}
.topo .setor{display:flex;background:#2a201b;border-radius:10px;padding:3px}
.topo .setor button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--sub)}
.topo .setor button.on{background:var(--laranja);color:#fff}
.topo .esp{flex:1}
.topo .relogio{font:700 22px -apple-system,sans-serif;font-variant-numeric:tabular-nums}
.conexao{width:10px;height:10px;border-radius:50%;background:#5c5}
.conexao.off{background:#e55}
.topo .mini{background:none;border:1px solid var(--borda);border-radius:8px;padding:6px 10px;color:var(--sub);cursor:pointer;font-size:13px}
/* colunas */
.quadro{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;height:calc(100vh - 58px);padding:12px}
#avisoSite[style*="flex"]+.quadro{height:calc(100vh - 58px - 74px)}
.col{display:flex;flex-direction:column;min-height:0;background:#18120f;border-radius:14px;border:1px solid #2a201b}
.col h2{margin:0;padding:12px 14px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a201b}
.col h2 .n{background:#2d231e;border-radius:20px;padding:2px 10px;font-size:14px;letter-spacing:0}
.col .lista{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.col.novo h2{color:var(--amarelo)}.col.preparo h2{color:#ff9c55}.col.pronto h2{color:var(--ok)}
.ped{background:var(--card);border:2px solid var(--borda);border-radius:14px;padding:12px 14px}
.ped.alerta{border-color:var(--amarelo)}
.ped.atraso{border-color:var(--vermelho);box-shadow:0 0 0 2px rgba(224,83,63,.25)}
.ped.novoAgora{animation:chega 1s 3}
@keyframes chega{50%{background:#4a3520}}
.ped .h{display:flex;align-items:baseline;gap:10px}
.ped .mesa{font:800 30px -apple-system,sans-serif}
.ped .num{color:var(--sub);font-size:14px}
.ped .esp{flex:1}
.ped .tempo{font:800 22px -apple-system,sans-serif;font-variant-numeric:tabular-nums}
.ped.alerta .tempo{color:var(--amarelo)}.ped.atraso .tempo{color:var(--vermelho)}
.ped .quem{color:var(--sub);font-size:13px;margin:2px 0 8px}
.ped .it{display:flex;gap:10px;font-size:20px;padding:5px 0;border-top:1px solid #33271f}
.ped .it:first-of-type{border-top:0}
.ped .it b{min-width:38px;color:var(--laranja)}
.ped .it .r{font-size:14px;color:var(--sub)}
.ped .it .ob{display:block;background:#4a3a12;color:#ffd77a;border-radius:6px;padding:3px 8px;margin-top:4px;font-size:16px;font-weight:700}
.ped .it.canc{text-decoration:line-through;color:#776}
.ped .it.canc .ob{display:none}
.ped .acao{width:100%;margin-top:10px;padding:16px;font-size:18px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
.ped .acao.comecar{background:#ff9c55;color:#1a1411}
.ped .acao.pronto{background:var(--ok);color:#fff}
.ped .voltar{background:none;border:0;color:var(--sub);text-decoration:underline;margin-top:8px;cursor:pointer;font-size:13px}
.ped .dest{font-size:12px;font-weight:700;border-radius:20px;padding:2px 8px;background:#2d231e;color:var(--sub)}
.vazio{color:#6f6156;text-align:center;padding:30px 10px;font-size:15px}
.ativar{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px}
.ativar button{font-size:22px;padding:20px 30px}
@media (max-width:820px){ body{overflow:auto} .quadro{grid-template-columns:1fr;height:auto} .col{max-height:none} .topo h1{display:none} }
</style>
</head>

    <h1>Pedidos</h1>
    <div class="setor" id="setor"><button data-s="cozinha">🍳 Cozinha</button><button data-s="bar">🍹 Bar</button><button data-s="todos">Tudo</button></div>
    <div class="esp"></div>
    <span class="conexao" id="cx" title="Conexão em tempo real"></span>
    <span class="relogio" id="relogio"></span>
    <button class="mini" id="bSair">Sair</button>
  </header>
  <div id="avisoSite" style="display:none;margin:12px 12px 0;background:#4a3520;border:2px solid #ff9c55;border-radius:12px;padding:12px 16px;font-size:18px;font-weight:700;align-items:center;gap:12px"></div>
  <div class="quadro">
    <section class="col novo"><h2>Novos <span class="n" id="nNovo">0</span></h2><div class="lista" id="lNovo"></div></section>
    <section class="col preparo"><h2>Em preparo <span class="n" id="nPrep">0</span></h2><div class="lista" id="lPrep"></div></section>
    <section class="col pronto"><h2>Prontos <span class="n" id="nPronto">0</span></h2><div class="lista" id="lPronto"></div></section>
  </div>
</section>
<div class="ativar oculto" id="ativar">
  <div style="font-size:20px">Toque para ativar o som dos novos pedidos<br><span style="font-size:14px;color:#a8998a">e manter a tela sempre acesa</span></div>
  <button class="btn pri" id="bAtivar">🔔 Ativar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://xcgwgqkvpquyrwxbpqqm.supabase.co", SUPABASE_KEY="sb_publishable_7cKmXXVOibhK1n49Y5l6vA_KpZlmM4i";
const ALERTA_MIN=15, ATRASO_MIN=25;      // minutos para ficar amarelo / vermelho
const PRONTOS_POR_MIN=20;                // por quanto tempo os prontos ficam na tela
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"senorx-equipe"}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let setor="cozinha"; try{ setor=localStorage.getItem("senorx_setor")||"cozinha"; }catch(e){}
let PED=[], conhecidos=null, audio=null, wake=null; const vistosSite=new Set(); let siteIniciado=false;

function mostrar(id){ ["tLogin","tApp"].forEach(x=>$(x).classList.toggle("oculto",x!==id)); }
$("fLogin").addEventListener("submit",async e=>{
  e.preventDefault(); $("loginMsg").textContent="Entrando…";
  const l=$("email").value.trim().toLowerCase(); const {error}=await sb.auth.signInWithPassword({email:l.includes("@")?l:l+"@senorx.equipe",password:$("senha").value});
  if(error){ $("loginMsg").textContent=/banned/i.test(error.message)?"Este usuário está bloqueado.":/credentials|invalid/i.test(error.message)?"Usuário ou senha incorretos.":error.message; return; }
  $("loginMsg").textContent=""; iniciar();
});
$("bSair").onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

async function iniciar(){
  const {data:ok}=await sb.rpc("is_equipe");
  if(!ok){ await sb.auth.signOut(); mostrar("tLogin"); $("loginMsg").textContent="Este usuário não tem acesso (bloqueado ou sem cadastro)."; return; }
  mostrar("tApp"); marcarSetor(); $("ativar").classList.remove("oculto");
  await carregar(); ligar();
}
$("bAtivar").onclick=async()=>{
  try{ audio=new (window.AudioContext||window.webkitAudioContext)(); bip(); }catch(e){}
  await pedirTelaAcesa(); $("ativar").classList.add("oculto");
};
async function pedirTelaAcesa(){ try{ if("wakeLock" in navigator) wake=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ pedirTelaAcesa(); carregar(); } });
function bip(){ if(!audio) return; [0,.22,.44].forEach((t,k)=>{ const o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value=k===2?1175:880; const s=audio.currentTime+t; g.gain.setValueAtTime(.001,s); g.gain.exponentialRampToValueAtTime(.4,s+.02); g.gain.exponentialRampToValueAtTime(.001,s+.18); o.start(s); o.stop(s+.2); }); }

function marcarSetor(){ document.querySelectorAll("#setor button").forEach(b=>b.classList.toggle("on",b.dataset.s===setor)); }
$("setor").onclick=e=>{ const b=e.target.closest("[data-s]"); if(!b) return; setor=b.dataset.s; try{localStorage.setItem("senorx_setor",setor);}catch(x){} marcarSetor(); conhecidos=null; carregar(); };

async function carregar(){
  const desde=new Date(Date.now()-PRONTOS_POR_MIN*60000).toISOString();
  let q=sb.from("pedidos").select("*, pedido_itens(*)").or(`status.in.(novo,preparo),and(status.eq.pronto,pronto_em.gte.${desde})`).order("criado_em");
  if(setor!=="todos") q=q.eq("destino",setor);
  const {data,error}=await q;
  if(error){ $("cx").classList.add("off"); return; }
  const novosIds=data.filter(p=>p.status==="novo").map(p=>p.id);
  const chegaram=conhecidos?novosIds.filter(id=>!conhecidos.has(id)):[];
  conhecidos=new Set([...(conhecidos||[]),...data.map(p=>p.id)]);
  PED=data; desenhar(chegaram);
  if(chegaram.length) bip();
  // pedidos do site ainda não aceitos
  const {data:ag}=await sb.from("comandas").select("id,codigo,tipo,cliente_nome,aberta_em").in("tipo",["delivery","retirada"]).eq("etapa","recebido").eq("status","aberta").order("aberta_em");
  const box=$("avisoSite");
  if(ag&&ag.length){
    const novosSite=ag.filter(x=>!vistosSite.has(x.id)); ag.forEach(x=>vistosSite.add(x.id)); if(novosSite.length&&siteIniciado) bip(); siteIniciado=true;
    box.style.display="flex";
    box.innerHTML=`<span style="flex:1">🔔 ${ag.length} pedido${ag.length>1?"s":""} do site aguardando confirmação: ${ag.map(x=>(x.tipo==="delivery"?"🛵 ":"🏃 ")+esc(x.cliente_nome)).join(", ")}</span>${ag.map(x=>`<button class="btn pri" data-aceitar="${x.id}">Aceitar ${esc(x.codigo)}</button>`).join("")}`;
  } else { box.style.display="none"; siteIniciado=true; }
}
const minutos=iso=>(Date.now()-new Date(iso))/60000;
const cron=iso=>{ const s=Math.max(0,Math.floor((Date.now()-new Date(iso))/1000)); const m=Math.floor(s/60); return m>=60?Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"):m+":"+String(s%60).padStart(2,"0"); };
function card(p,novoAgora){
  const m=minutos(p.criado_em), cls=p.status==="pronto"?"":(m>=ATRASO_MIN?"atraso":m>=ALERTA_MIN?"alerta":"");
  return `<div class="ped ${cls}${novoAgora?" novoAgora":""}" data-p="${p.id}">
    <div class="h"><span class="mesa">${p.tipo==="delivery"?"🛵 "+esc(p.cliente_nome||"Delivery"):p.tipo==="retirada"?"🏃 "+esc(p.cliente_nome||"Retirada"):"Mesa "+p.mesa}</span><span class="num">#${p.numero}</span>${setor==="todos"?`<span class="dest">${p.destino==="bar"?"🍹 bar":"🍳 cozinha"}</span>`:""}<span class="esp"></span><span class="tempo" data-t="${p.criado_em}">${p.status==="pronto"?"✓":cron(p.criado_em)}</span></div>
    <div class="quem">${p.tipo==="delivery"?"<b style=\"color:#ff9c55\">DELIVERY</b> · ":p.tipo==="retirada"?"<b style=\"color:#ff9c55\">RETIRADA NO BALCÃO</b> · ":""}${esc(p.garcom_nome||"")} · ${new Date(p.criado_em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</div>
    ${p.pedido_itens.map(i=>`<div class="it${i.cancelado?" canc":""}"><b>${i.qtd}×</b><span>${esc(i.nome)}${i.rotulo?` <span class="r">${esc(i.rotulo)}</span>`:""}${i.cancelado?' <span class="r">(cancelado)</span>':""}${i.obs?`<span class="ob">${esc(i.obs)}</span>`:""}</span></div>`).join("")}
    ${p.status==="novo"?`<button class="acao comecar" data-a="preparo">Começar preparo</button>`:""}
    ${p.status==="preparo"?`<button class="acao pronto" data-a="pronto">PRONTO ✓</button><button class="voltar" data-a="novo">voltar para novos</button>`:""}
    ${p.status==="pronto"?`<button class="voltar" data-a="preparo">desfazer (voltar para preparo)</button>`:""}
  </div>`;
}
function desenhar(chegaram=[]){
  const visiveis=PED.filter(p=>p.pedido_itens.some(i=>!i.cancelado)||p.status!=="novo");
  const por=s=>visiveis.filter(p=>p.status===s);
  const prontos=por("pronto").sort((a,b)=>new Date(b.pronto_em)-new Date(a.pronto_em));
  $("lNovo").innerHTML=por("novo").map(p=>card(p,chegaram.includes(p.id))).join("")||`<div class="vazio">Nenhum pedido novo</div>`;
  $("lPrep").innerHTML=por("preparo").map(p=>card(p)).join("")||`<div class="vazio">Nada em preparo</div>`;
  $("lPronto").innerHTML=prontos.map(p=>card(p)).join("")||`<div class="vazio">Os pedidos prontos aparecem aqui por ${PRONTOS_POR_MIN} min</div>`;
  $("nNovo").textContent=por("novo").length; $("nPrep").textContent=por("preparo").length; $("nPronto").textContent=prontos.length;
}
$("avisoSite").addEventListener("click",async e=>{
  const b=e.target.closest("[data-aceitar]"); if(!b) return; b.disabled=true; b.textContent="Aceitando…";
  const {error}=await sb.rpc("acao_delivery",{p_comanda:b.dataset.aceitar,p_acao:"aceitar"});
  if(error){ b.disabled=false; b.textContent="Tentar de novo"; return; } carregar();
});
document.querySelector(".quadro").addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const id=b.closest("[data-p]").dataset.p, st=b.dataset.a;
  const p=PED.find(x=>x.id===id); if(p){ p.status=st; if(st==="pronto") p.pronto_em=new Date().toISOString(); desenhar(); }
  const {error}=await sb.from("pedidos").update({status:st}).eq("id",id);
  if(error){ alertaErro(); carregar(); }
});
function alertaErro(){ $("cx").classList.add("off"); }

let canal=null, tRec=null;
const recarregar=()=>{ clearTimeout(tRec); tRec=setTimeout(carregar,300); };
function ligar(){
  if(canal) sb.removeChannel(canal);
  canal=sb.channel("cozinha")
    .on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},recarregar)
    .on("postgres_changes",{event:"*",schema:"public",table:"pedido_itens"},recarregar)
    .on("postgres_changes",{event:"*",schema:"public",table:"comandas"},recarregar)
    .subscribe(s=>$("cx").classList.toggle("off",s!=="SUBSCRIBED"));
}
setInterval(carregar,15000);
setInterval(()=>{
  $("relogio").textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  document.querySelectorAll(".ped .tempo[data-t]").forEach(el=>{ if(el.textContent==="✓") return; el.textContent=cron(el.dataset.t);
    const m=minutos(el.dataset.t), c=el.closest(".ped"); c.classList.toggle("alerta",m>=ALERTA_MIN&&m<ATRASO_MIN); c.classList.toggle("atraso",m>=ATRASO_MIN); });
},1000);

(async()=>{ const {data}=await sb.auth.getSession(); if(data&&data.session) iniciar(); else mostrar("tLogin"); })();
</script>
</body>
