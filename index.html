<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardápio · Señor X Hamburgueria</title>
<meta name="description" content="Cardápio da Señor X Hamburgueria: hambúrgueres, buffet, porções, bebidas e promoções.">
<meta name="theme-color" content="#1B1512">
<meta property="og:title" content="Cardápio · Señor X Hamburgueria">
<meta property="og:description" content="Veja o cardápio e as promoções do dia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--laranja:#CF7132;--laranja2:#E89356;--creme:#F1E4D3;--suave:#B8A896;--fundo:#1B1512;--linha:rgba(207,113,50,.22)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fundo);color:var(--creme);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{text-align:center;padding:34px 20px 20px}
header svg.lg{width:136px;color:var(--laranja)}
header .slogan{font:500 12px Oswald,sans-serif;letter-spacing:.42em;text-transform:uppercase;margin:14px 0 0}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:var(--laranja)}
.orn i{width:56px;height:1px;background:var(--laranja)}
.orn svg{width:9px;height:9px}
.status{font-size:12px;color:var(--suave);margin-top:10px}
nav{position:sticky;top:0;z-index:5;background:rgba(27,21,18,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--laranja2);text-decoration:none;font:500 13px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border:1px solid rgba(207,113,50,.45);border-radius:20px}
nav a.on{background:var(--laranja);color:var(--fundo);border-color:var(--laranja)}
main{max-width:660px;margin:0 auto;padding:4px 18px 30px}
/* promoções */
.promos{max-width:660px;margin:0 auto;padding:16px 18px 4px}
.promos h2{font:500 13px Oswald,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--laranja);text-align:center;margin:0 0 10px}
.promo-lista{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.promo-lista::-webkit-scrollbar{display:none}
.promo{flex:0 0 86%;scroll-snap-align:center;border:1.5px solid var(--laranja);border-radius:14px;padding:16px 16px 14px;background:linear-gradient(160deg,rgba(207,113,50,.16),rgba(207,113,50,.03));position:relative;overflow:hidden}
.promo:only-child{flex-basis:100%}
.promo img{width:calc(100% + 32px);margin:-16px -16px 12px;display:block;aspect-ratio:16/9;object-fit:cover}
.promo .tag{display:inline-block;font:700 10px Inter;letter-spacing:.12em;text-transform:uppercase;background:var(--laranja);color:var(--fundo);border-radius:4px;padding:3px 7px}
.promo h3{font:800 22px "Playfair Display",serif;margin:8px 0 4px;color:var(--creme)}
.promo p{margin:0;color:var(--suave);font-size:13.5px;line-height:1.45}
.promo .pp{margin-top:10px;display:flex;align-items:baseline;gap:10px}
.promo .de{color:var(--suave);text-decoration:line-through;font-size:14px}
.promo .por{font:800 24px "Playfair Display",serif;color:var(--creme)}
.promo .quando{font-size:11.5px;color:var(--laranja2);margin-top:8px;letter-spacing:.04em}
/* seções */
section{padding-top:26px;scroll-margin-top:58px}
.sh{text-align:center;margin-bottom:10px;color:var(--laranja)}
.sh svg{width:34px;height:34px}
.sh h2{font:800 27px "Playfair Display",serif;color:var(--creme);margin:4px 0 0}
.sh h2 small{font:500 12px Oswald,sans-serif;color:var(--laranja);letter-spacing:.12em;text-transform:uppercase}
.it{padding:12px 0;border-bottom:1px solid var(--linha)}
.it:last-child{border-bottom:0}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.it h3{margin:0;font:500 17px Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--laranja2)}
.ps{display:flex;gap:14px;flex:none;text-align:right}
.pr{font:700 17px "Playfair Display",serif;color:var(--creme);white-space:nowrap}
.pr em{display:block;font:500 10px Inter;font-style:normal;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.it p{margin:4px 0 0;font-size:13.5px;line-height:1.45;color:var(--suave)}
.o{font:600 11px Inter;color:var(--laranja);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.selo{display:inline-block;vertical-align:2px;font:700 9px Inter;letter-spacing:.08em;text-transform:uppercase;background:var(--laranja);color:var(--fundo);padding:3px 6px;border-radius:4px;margin-left:6px}
.selo.chef,.selo.vegetariano{background:none;color:var(--laranja2);border:1px solid var(--laranja)}
.selo.picante{background:#B83A2E;color:#fff}
.qd{border:1px solid var(--laranja);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:6px}
.qd h4{grid-column:1/-1;margin:0 0 2px;text-align:center;font:500 13px Oswald;letter-spacing:.12em;text-transform:uppercase;color:var(--creme)}
.qd div{display:flex;justify-content:space-between;gap:8px;font:500 14px Oswald,sans-serif;text-transform:uppercase;color:var(--laranja2)}
.qd b{font:700 14px "Playfair Display",serif;color:var(--creme);white-space:nowrap}
.ls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ls h4{font:500 15px Oswald,sans-serif;text-transform:uppercase;color:var(--laranja2);margin:4px 0 2px}
.ls p{margin:0;color:var(--suave);font-size:13.5px;line-height:1.6}
.ls-p{margin-top:12px;padding-top:10px;border-top:1px solid var(--linha)}
.nt{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
footer{text-align:center;padding:30px 20px calc(46px + env(safe-area-inset-bottom));border-top:1px solid var(--linha);margin-top:20px}
footer a.bt{display:inline-block;margin:6px;color:var(--creme);text-decoration:none;font:500 15px Oswald,sans-serif;letter-spacing:.08em;border:1px solid var(--laranja);padding:11px 20px;border-radius:24px}
footer a.bt.w{background:var(--laranja);color:var(--fundo)}
footer p{color:var(--suave);font-size:13px;line-height:1.55}
footer b{color:var(--laranja2);font:500 12px Oswald;letter-spacing:.14em;text-transform:uppercase}
.carregando{text-align:center;color:var(--suave);padding:50px 20px}
.carregando .sp{width:28px;height:28px;border:3px solid var(--linha);border-top-color:var(--laranja);border-radius:50%;margin:0 auto 12px;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.erro{text-align:center;padding:40px 20px;color:var(--suave)}
.erro button{margin-top:12px;background:var(--laranja);color:var(--fundo);border:0;border-radius:20px;padding:10px 18px;font:600 14px Inter;cursor:pointer}

/* ---------- pedido online ---------- */
.it{position:relative}
.it.pedivel .r{padding-right:46px}
.it.pedivel>p,.it.pedivel>.o{padding-right:46px}
.add{position:absolute;right:0;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:var(--laranja);color:var(--fundo);font:700 22px/1 Inter,sans-serif;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.add .qn{font-size:14px}
.qd div.pedivel{cursor:pointer}
.qd div .mini{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--laranja);color:var(--fundo);font:700 14px Inter;margin-left:6px}
.bt-lista{display:block;width:100%;margin-top:12px;background:var(--laranja);color:var(--fundo);border:0;border-radius:12px;padding:13px;font:700 15px Inter;cursor:pointer}
.sacola{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:var(--laranja);color:var(--fundo);border:0;border-radius:16px;padding:15px 18px;font:700 16px Inter;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;max-width:636px;margin:0 auto}
.sacola .ct{background:var(--fundo);color:var(--laranja);border-radius:20px;min-width:26px;height:26px;display:inline-grid;place-items:center;padding:0 7px;margin-right:10px;font-size:14px}
body.com-sacola footer{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.acomp{max-width:660px;margin:12px auto 0;padding:0 18px}
.acomp button{width:100%;background:#2a201b;border:1px solid var(--laranja);color:var(--creme);border-radius:12px;padding:12px;font:600 14px Inter;cursor:pointer}
.veu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#231b17;color:var(--creme);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.5);max-width:680px;margin:0 auto;-webkit-overflow-scrolling:touch}
.folha h2{font:800 22px "Playfair Display",serif;margin:0 0 4px}
.folha .sub{color:var(--suave);font-size:14px;margin-bottom:12px;line-height:1.45}
.folha .fx{float:right;background:none;border:0;color:var(--suave);font-size:26px;line-height:1;cursor:pointer;margin:-4px -4px 0 8px}
.folha label.l{display:block;font:600 12.5px Inter;color:var(--suave);margin:14px 0 6px;letter-spacing:.03em}
.folha .t{width:100%;background:#1B1512;border:1px solid #4a3a30;border-radius:10px;padding:12px;color:var(--creme);font:16px Inter}
.folha .t:focus{outline:2px solid rgba(207,113,50,.5);border-color:var(--laranja)}
.folha select.t{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#CF7132 50%),linear-gradient(135deg,#CF7132 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.ops button{background:#1B1512;border:1px solid #4a3a30;color:var(--creme);border-radius:22px;padding:10px 14px;font:500 14px Inter;cursor:pointer}
.ops button.on{background:var(--laranja);border-color:var(--laranja);color:var(--fundo);font-weight:700}
.qtd{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0 6px}
.qtd button{width:48px;height:48px;border-radius:50%;border:1px solid #4a3a30;background:#1B1512;color:var(--creme);font-size:24px;cursor:pointer}
.qtd b{font:700 26px Inter;min-width:36px;text-align:center}
.pri{display:block;width:100%;margin-top:16px;background:var(--laranja);color:var(--fundo);border:0;border-radius:14px;padding:16px;font:700 16px Inter;cursor:pointer}
.pri:disabled{opacity:.5}
.sec{display:block;width:100%;margin-top:10px;background:none;color:var(--creme);border:1px solid #4a3a30;border-radius:14px;padding:14px;font:600 15px Inter;cursor:pointer}
.lsac{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--linha)}
.lsac .n{flex:1;min-width:0}.lsac .n b{font:500 15px Oswald,sans-serif;text-transform:uppercase;color:var(--laranja2);letter-spacing:.03em}.lsac .n small{display:block;color:var(--suave);font-size:12.5px}
.lsac .m{display:flex;align-items:center;gap:8px}
.lsac .m button{width:30px;height:30px;border-radius:50%;border:1px solid #4a3a30;background:#1B1512;color:var(--creme);font-size:17px;cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.tot.g{font:800 20px "Playfair Display",serif;border-top:1px solid var(--linha);margin-top:6px;padding-top:12px}
.erro-f{background:#5a1f17;color:#ffd2cb;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.aviso-f{background:#3a2d1b;color:#ffd77a;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.codigo{font:800 40px Inter;letter-spacing:.18em;text-align:center;color:var(--laranja);margin:6px 0}
.pix{background:#1B1512;border:1px dashed var(--laranja);border-radius:12px;padding:14px;margin-top:12px;text-align:center}
.pix b{display:block;font:700 18px Inter;word-break:break-all;margin:4px 0 10px}
.etapas{margin:16px 0 4px;padding:0;list-style:none}
.etapas li{position:relative;padding:0 0 16px 30px;color:#7d6e62;font-size:15px}
.etapas li:before{content:"";position:absolute;left:6px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid #5a4a3f;background:var(--fundo)}
.etapas li:after{content:"";position:absolute;left:12px;top:20px;bottom:0;width:2px;background:#3a2d25}
.etapas li:last-child:after{display:none}
.etapas li.ok{color:var(--creme)}.etapas li.ok:before{background:var(--laranja);border-color:var(--laranja)}
.etapas li.atual{color:var(--creme);font-weight:700}.etapas li.atual:before{background:var(--ok,#3fa34d);border-color:#3fa34d;box-shadow:0 0 0 4px rgba(63,163,77,.25)}
.fechado{max-width:660px;margin:12px auto 0;padding:0 18px}.fechado div{background:#2a201b;border:1px solid #4a3a30;border-radius:12px;padding:12px;text-align:center;color:var(--suave);font-size:14px}
</style>
</head>

async function api(caminho){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`,{headers:{apikey:SUPABASE_KEY,Accept:"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function carregar(){
  const [rest,secoes,promos,bairros]=await Promise.all([
    api("restaurante?select=*&id=eq.1"),
    api("secoes?select=*,itens(*)&ativo=eq.true&order=ordem.asc&itens.order=ordem.asc"),
    api("promocoes?select=*&ativo=eq.true&order=ordem.asc").catch(()=>[]),
    api("bairros?select=*&ativo=eq.true&order=ordem.asc,nome.asc").catch(()=>[])
  ]);
  return {restaurante:rest[0]||{},secoes,promos,bairros,em:Date.now()};
}

function promoAtiva(p,hoje){
  const d=hoje.toISOString().slice(0,10);
  if(p.inicio && d<p.inicio) return false;
  if(p.fim && d>p.fim) return false;
  if(p.dias_semana && p.dias_semana.length && !p.dias_semana.includes(hoje.getDay())) return false;
  return true;
}
function textoDias(p){
  if(!p.dias_semana||!p.dias_semana.length||p.dias_semana.length===7) return p.fim?`Válida até ${p.fim.split("-").reverse().join("/")}`:"";
  const nomes=[...p.dias_semana].sort().map(i=>DIAS[i][0].toUpperCase()+DIAS[i].slice(1));
  return "Válida: "+nomes.join(", ");
}

function marcarNav(){
  const links=[...document.querySelectorAll("nav a")];
  if(!("IntersectionObserver" in window)||!links.length) return;
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id)); const on=links.find(a=>a.classList.contains("on")); on&&on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); } })},{rootMargin:"-60px 0px -70% 0px"});
  document.querySelectorAll("main section").forEach(s=>obs.observe(s));
}

async function iniciar(){

    <div class="sub">Guarde o código para acompanhar:</div><div class="codigo">${esc(u.codigo)}</div>
    <div class="tot g" style="margin-top:0"><span>Total</span><span>${brl(u.total)}</span></div>
    ${u.pag==="pix"?`<div class="pix">Pague com Pix para a chave:<b id="pChave">${esc(u.pix_chave||"(chave não cadastrada: combine pelo WhatsApp)")}</b>${u.pix_nome?`<div style="font-size:13px;color:var(--suave)">${esc(u.pix_nome)}${u.pix_banco?" · "+esc(u.pix_banco):""}</div>`:""}
      ${u.pix_chave?`<button class="sec" id="pCopiar">Copiar chave Pix</button>`:""}</div>`:""}
    ${tel?`<a class="pri" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/55${tel}?text=${msgZap}">${u.pag==="pix"?"Enviar comprovante no WhatsApp":"Falar com o restaurante"}</a>`:""}
    <ul class="etapas" id="etapas"><li class="atual">Pedido enviado</li></ul>
    <div class="sub" id="eInfo" style="text-align:center">Tempo estimado: ${esc(u.tempo||"")}</div>
    <button class="sec" id="eFechar">Voltar ao cardápio</button>`,f=>{
      f.querySelector("#eFechar").onclick=fechar;
      const cp=f.querySelector("#pCopiar"); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(u.pix_chave); cp.textContent="Chave copiada ✓"; }catch(e){ const rg=document.createRange(); rg.selectNodeContents(f.querySelector("#pChave")); getSelection().removeAllRanges(); getSelection().addRange(rg); cp.textContent="Selecionada: copie"; } };
      atualizarAcomp(u);
    });
  clearInterval(tAcomp); tAcomp=setInterval(()=>{ if(document.getElementById("etapas")) atualizarAcomp(u); else clearInterval(tAcomp); },20000);
}
async function atualizarAcomp(u){
  try{
    const resp=await fetch(`${SUPABASE_URL}/rest/v1/rpc/acompanhar_pedido`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({p_codigo:u.codigo,p_telefone:u.tel})});
    const a=await resp.json(); const el=document.getElementById("etapas"); if(!a||!el) return;
    if(a.etapa==="cancelado"){ el.innerHTML=`<li class="atual" style="color:#ff9a8f">Pedido cancelado${a.motivo?": "+esc(a.motivo):""}</li>`; document.getElementById("eInfo").textContent="Em caso de dúvida, fale com o restaurante."; return; }
    const ent=a.tipo==="delivery";
    const passos=[["recebido","Pedido recebido"],["aceito","Confirmado pelo restaurante"],["preparo","Em preparo"],[ent?"saiu":"pronto",ent?"Saiu para entrega":"Pronto para retirar"],["entregue",ent?"Entregue":"Retirado"]];
    let atual=0;
    if(a.etapa==="aceito") atual=a.cozinha==="pronto"?3:(a.cozinha==="preparo"?2:1);
    if(a.etapa==="saiu") atual=3; if(a.etapa==="entregue") atual=4;
    el.innerHTML=passos.map((p,k)=>`<li class="${k<atual?"ok":k===atual?"atual":""}">${p[1]}</li>`).join("")+(a.forma_pagamento==="pix"?`<li class="${a.pagamento_status==="pago"?"ok":""}">${a.pagamento_status==="pago"?"Pix confirmado ✓":"Aguardando confirmação do Pix"}</li>`:"");
    if(a.etapa==="entregue"){ clearInterval(tAcomp); document.getElementById("eInfo").textContent="Obrigado pela preferência! 🍔"; }
  }catch(e){}
}
function mostrarAcompanhar(){
  const u=ler(K_ULT,null), box=document.getElementById("acomp");
  if(MESA){ box.innerHTML=`<div class="acomp"><div style="background:#2a201b;border:1px solid var(--laranja);border-radius:12px;padding:12px;text-align:center"><div style="font:800 22px 'Playfair Display',serif;color:var(--creme)">Mesa ${MESA}</div><div style="color:var(--suave);font-size:14px;margin-top:2px">Escolha à vontade e faça seu pedido com o garçom 🍔</div></div></div>`; document.getElementById("fechado").innerHTML=""; return; }
  if(!u||Date.now()-u.em>12*3600e3){ box.innerHTML=""; return; }
  box.innerHTML=`<div class="acomp"><button id="bAcomp">📦 Acompanhar meu pedido ${esc(u.codigo)}</button></div>`;
  document.getElementById("bAcomp").onclick=()=>mostrarConfirmacao(u,false);
}
iniciar();
</script>
