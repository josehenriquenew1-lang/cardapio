<title>Garçom · Señor X</title>
<style>
:root{--laranja:#CF7132;--laranja-esc:#b45f27;--fundo:#1B1512;--creme:#F1E4D3;--bg:#f4f0ea;--card:#fff;--borda:#e4ddd3;--txt:#2a2420;--sub:#7a6f66;--ok:#2e7d32;--erro:#b3261e;--amarelo:#f2b632}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button,input,textarea,select{font:inherit;color:inherit}
.oculto{display:none!important}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--fundo)}
.login .cx{width:100%;max-width:360px;background:#241c18;border:1px solid #3a2d25;border-radius:18px;padding:28px 22px;color:var(--creme)}
.login svg{width:84px;display:block;margin:0 auto 10px;color:var(--laranja)}
.login h1{font:700 20px Georgia,serif;text-align:center;margin:0 0 18px}
.login label{display:block;font-size:13px;color:#cbbba9;margin:12px 0 6px}
.login input{width:100%;padding:13px;border-radius:10px;border:1px solid #4a3a30;background:#1B1512;color:var(--creme);font-size:16px}
.msg{margin-top:12px;font-size:14px;min-height:20px;text-align:center;color:#ff9a8f}
.nomes{display:grid;gap:10px;margin-top:6px}
.nomes button{padding:16px;border-radius:12px;border:1px solid #4a3a30;background:#2d231e;color:var(--creme);font-size:18px;font-weight:600;cursor:pointer}
/* geral */
.btn{border:1px solid var(--borda);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--laranja);border-color:var(--laranja);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.perigo{color:var(--erro)}
.btn.bloco{width:100%;padding:15px;font-size:17px}
.btn:disabled{opacity:.55}
.topo{position:sticky;top:0;z-index:20;background:var(--fundo);color:var(--creme);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.topo h1{font:700 18px Georgia,serif;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .vt{background:none;border:0;color:var(--creme);font-size:26px;line-height:1;padding:0 6px 0 0;cursor:pointer}
.topo .chip{color:#E89356;font-size:13px;background:none;border:1px solid #5a4a3f;border-radius:20px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.conexao{width:9px;height:9px;border-radius:50%;background:#7c7;flex:none}
.conexao.off{background:#e66}
main{padding:12px 12px calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
/* mesas */
.legenda{display:flex;gap:12px;font-size:12.5px;color:var(--sub);margin:2px 2px 10px;flex-wrap:wrap}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.mesa{aspect-ratio:1/1;border-radius:14px;border:1.5px solid var(--borda);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:6px;text-align:center}
.mesa b{font-size:28px;line-height:1}
.mesa small{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.2}
.mesa.ocupada{border-color:var(--laranja);background:#fff4ea}
.mesa.ocupada b{color:var(--laranja-esc)}
.mesa.cliente{border-color:#e0533f;background:#fdecea;animation:pisca2 1s infinite}
.mesa.cliente b{color:#b3261e}
@keyframes pisca2{50%{box-shadow:0 0 0 5px rgba(224,83,63,.3)}}
.st.aguardando{background:#fde2df;color:#8c1d16}
.mesa.pronto{border-color:var(--ok);background:#e8f5e9;animation:pisca 1.2s infinite}
.mesa.pronto b{color:var(--ok)}
.mesa .minha{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--laranja)}
@keyframes pisca{50%{box-shadow:0 0 0 5px rgba(46,125,50,.25)}}
/* conta */
.pedido{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px;margin-bottom:10px}
.pedido .ph{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:6px}
.st{font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px}
.st.novo{background:#fff3cd;color:#7a5a00}.st.preparo{background:#ffe0c2;color:#8a4310}.st.pronto{background:#d6f0d8;color:#1d5c22}.st.entregue{background:#eee;color:#666}.st.cancelado{background:#fde2df;color:#8c1d16}
.li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid #f3eee7}
.li:first-of-type{border-top:0}
.li .q{font-weight:800;min-width:30px}
.li .n{flex:1}
.li .n small{display:block;color:#a35a00;font-size:13px}
.li .v{white-space:nowrap;font-weight:600}
.li.cancel .n,.li.cancel .v,.li.cancel .q{text-decoration:line-through;color:#aaa}
.li .x{display:block;border:0;background:none;color:var(--erro);font-size:13px;font-weight:600;cursor:pointer;padding:4px 0 0}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin:6px 4px 14px}
.total b{font:700 26px Georgia,serif}
/* cardápio */
.secs{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:10;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.secs button{flex:none;border:1px solid var(--borda);background:#fff;border-radius:20px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer}
.secs button.on{background:var(--fundo);color:#fff;border-color:var(--fundo)}
.prod{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.prod .n{flex:1;min-width:0}.prod .n b{display:block}.prod .n span{font-size:13px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .p{font-weight:700;white-space:nowrap}
.prod .qc{background:var(--laranja);color:#fff;border-radius:20px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:700;padding:0 6px}
.titsec{font:700 13px -apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:16px 4px 8px}
/* barra de baixo */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--borda);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.barra .btn{flex:1;padding:15px;font-size:16px}
/* folha (bottom sheet) */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.folha h2{margin:0 0 4px;font-size:20px}
.folha .sub{color:var(--sub);font-size:14px;margin-bottom:12px}
.qtd{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.qtd button{width:52px;height:52px;border-radius:50%;border:1px solid var(--borda);background:#fff;font-size:26px;cursor:pointer}
.qtd b{font-size:30px;min-width:40px;text-align:center}
.opcs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.opcs button{border:1px solid var(--borda);background:#fff;border-radius:20px;padding:9px 13px;font-size:14px;cursor:pointer}
.opcs button.on{background:var(--laranja);color:#fff;border-color:var(--laranja)}
label.l{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px;font-weight:600}
.t{width:100%;border:1px solid var(--borda);border-radius:10px;padding:12px;font-size:16px;background:#fff}
.carr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #f3eee7}
.carr .n{flex:1}.carr .n small{display:block;color:#a35a00;font-size:13px}
.carr .mini{display:flex;align-items:center;gap:8px}
.carr .mini button{width:34px;height:34px;border-radius:50%;border:1px solid var(--borda);background:#fff;font-size:18px;cursor:pointer}
.aviso{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:60;background:var(--ok);color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;cursor:pointer}
.aviso.on{display:block;animation:entra .25s}
.aviso.erro{background:var(--erro)}
.aviso.neutro{background:var(--fundo)}
@keyframes entra{from{transform:translateY(-20px);opacity:0}}
.vazio{text-align:center;color:var(--sub);padding:30px 10px}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.formas button{padding:14px;border-radius:12px;border:1px solid var(--borda);background:#fff;font-weight:700;cursor:pointer}
.formas button.on{background:var(--fundo);color:#fff;border-color:var(--fundo)}
.linha{display:flex;justify-content:space-between;padding:6px 0}
</style>
</head>

async function carregarCardapio(){
  const {data,error}=await sb.from("secoes").select("*, itens(*)").eq("ativo",true).order("ordem").order("ordem",{referencedTable:"itens"});

  CARD=data.map(s=>({...s,itens:(s.itens||[]).filter(i=>!i.oculto)})).filter(s=>s.tipo==="listas"||s.itens.length);
}
async function carregarMesas(){
  const [m,c]=await Promise.all([
    sb.from("mesas").select("*").eq("ativo",true).order("numero"),
    sb.from("comandas").select("*, pedidos(*, pedido_itens(*))").eq("status","aberta")
  ]);
  if(m.error) throw m.error; if(c.error) throw c.error;
  MESAS=m.data; ABERTAS=c.data;
  ABERTAS.forEach(cm=>cm.pedidos.sort((a,b)=>a.numero-b.numero));
  // avisar pedidos prontos deste garçom
  ABERTAS.forEach(cm=>cm.pedidos.forEach(p=>{
    if(p.status==="aguardando" && !avisados.has("c"+p.id)){
      avisados.add("c"+p.id);

    }
    if(p.status==="pronto" && !avisados.has(p.id)){
      avisados.add(p.id);
      if(!carregarMesas.primeira && (!EU.id || p.garcom_id===EU.id || cm.garcom_id===EU.id)){ vibrar([300,120,300,120,300]); bip(); aviso(`✅ Mesa ${cm.mesa}: pedido pronto${p.destino==="bar"?" no bar":" na cozinha"}!`,"ok",8000); }
    }
  }));
  carregarMesas.primeira=false;
}

const temCliente=n=>{ const c=comandaDa(n); return c&&c.pedidos.some(p=>p.status==="aguardando"); };

  $("corpo").innerHTML=`<div class="legenda"><span><i style="background:#fff;border:1px solid #ccc"></i>Livre</span><span><i style="background:#e0533f"></i>Pedido do cliente</span><span><i style="background:var(--laranja)"></i>Ocupada</span><span><i style="background:var(--ok)"></i>Pedido pronto</span><span><i style="background:var(--laranja);border-radius:50%"></i>Minha mesa</span></div>
    <div class="grade">${MESAS.map(m=>{ const c=comandaDa(m.numero);
      return `<div class="mesa${c?" ocupada":""}${pronto(m.numero)?" pronto":""}${temCliente(m.numero)?" cliente":""}" data-m="${m.numero}">${c&&EU.id&&c.garcom_id===EU.id?'<span class="minha"></span>':""}<b>${m.numero}</b>
        <small>${c?(temCliente(m.numero)?"PEDIDO DO CLIENTE":pronto(m.numero)?"PRONTO":brl(subtotal(c))+"<br>"+tempo(c.aberta_em)):(m.nome?esc(m.nome):"livre")}</small></div>`; }).join("")}</div>`;
  $("corpo").onclick=e=>{ const m=e.target.closest("[data-m]"); if(!m) return; tela={nome:"mesa",mesa:+m.dataset.m}; carrinho=[]; render(); window.scrollTo(0,0); };
}

function telaMesa(){
  const n=tela.mesa, c=comandaDa(n);
  $("topo").innerHTML=`<button class="vt" id="bVolta">‹</button><span class="conexao"></span><h1>Mesa ${n}</h1>${c?`<span style="font-size:13px;color:#cbbba9">aberta há ${tempo(c.aberta_em)}</span>`:""}`;
  $("bVolta").onclick=()=>{ tela={nome:"mesas"}; render(); };
  let h="";
  if(!c) h=`<div class="vazio">Mesa livre.<br>Toque em <b>Adicionar itens</b> para abrir a conta.</div>`;
  else {
    h=c.pedidos.map(p=>`<div class="pedido" data-p="${p.id}">
      <div class="ph"><span>${p.destino==="bar"?"🍹 Bar":"🍳 Cozinha"} · ${new Date(p.criado_em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${esc(p.garcom_nome||"")}</span><span style="flex:1"></span><span class="st ${p.status}">${ST[p.status]}</span></div>
      ${p.pedido_itens.map(i=>`<div class="li${i.cancelado?" cancel":""}" data-i="${i.id}"><span class="q">${i.qtd}×</span><span class="n">${esc(i.nome)}${i.rotulo?" ("+esc(i.rotulo)+")":""}${i.obs?`<small>${esc(i.obs)}</small>`:""}${!i.cancelado&&(p.status==="novo"||p.status==="aguardando")?`<button class="x" data-c="cancelar">cancelar</button>`:""}</span><span class="v">${brl(i.preco*i.qtd)}</span></div>`).join("")}
      ${p.status==="pronto"?`<button class="btn ok bloco" style="margin-top:8px" data-c="entregue">Entreguei na mesa ✓</button>`:""}
      ${p.status==="aguardando"?`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn pri" style="flex:2" data-c="confirmar">✓ Confirmar e enviar</button><button class="btn perigo" style="flex:1" data-c="recusar">Recusar</button></div>`:""}
    </div>`).join("");
    h+=`<div class="total"><span>Total da mesa</span><b>${brl(subtotal(c))}</b></div>`;
  }
  $("corpo").innerHTML=h;
  $("barra").classList.remove("oculto");
  $("barra").innerHTML=`${c?`<button class="btn" id="bConta" style="flex:.6">🖨️ Conta</button><button class="btn" id="bFechar">Fechar conta</button>`:""}<button class="btn pri" id="bAdd">+ Adicionar itens</button>`;
  $("bAdd").onclick=()=>{ tela={nome:"cardapio",mesa:n}; secAtiva=null; busca=""; render(); window.scrollTo(0,0); };
  if(c) $("bFechar").onclick=()=>fecharConta(c);
  if(c) $("bConta").onclick=()=>contaParaImprimir(c);
  $("corpo").onclick=async e=>{
    const b=e.target.closest("[data-c]"); if(!b) return;
    if(b.dataset.c==="confirmar"||b.dataset.c==="recusar"){
      if(b.dataset.c==="recusar"&&!b.dataset.ok){ b.dataset.ok=1; b.textContent="Confirmar recusa"; setTimeout(()=>{ delete b.dataset.ok; b.textContent="Recusar"; },4000); return; }
      b.disabled=true;
      const {error}=await sb.rpc("confirmar_pedido_mesa",{p_pedido:b.closest("[data-p]").dataset.p,p_ok:b.dataset.c==="confirmar",p_garcom:EU.id||null});
      if(error) aviso(erroMsg(error),"erro"); else { aviso(b.dataset.c==="confirmar"?"Enviado para a cozinha ✓":"Pedido recusado","neutro"); await carregarMesas(); render(); }
      return;
    }
    if(b.dataset.c==="entregue"){ b.disabled=true; const {error}=await sb.rpc("marcar_entregue_mesa",{p_pedido:b.closest("[data-p]").dataset.p}); if(error) aviso(erroMsg(error),"erro"); else { await carregarMesas(); render(); } }
    if(b.dataset.c==="cancelar"){
      if(!b.dataset.ok){ b.dataset.ok=1; b.textContent="toque de novo para cancelar"; setTimeout(()=>{ delete b.dataset.ok; b.textContent="cancelar"; },4000); return; }
      const {error}=await sb.from("pedido_itens").update({cancelado:true}).eq("id",b.closest("[data-i]").dataset.i);
      if(error) aviso(erroMsg(error),"erro"); else { await carregarMesas(); render(); aviso("Item cancelado","neutro"); }
    }
  };
}

function precoTxt(i){ return i.precos.map(p=>p.valor==null?"—":brl(p.valor)+(p.rotulo?" "+p.rotulo:"")).join(" / "); }
function qtdNoCarrinho(chaveBase){ return carrinho.filter(c=>c.chave.startsWith(chaveBase)).reduce((s,c)=>s+c.qtd,0); }
function telaCardapio(){
  const n=tela.mesa;
  $("topo").innerHTML=`<button class="vt" id="bVolta">‹</button><h1>Mesa ${n} · Adicionar</h1>`;
  $("bVolta").onclick=()=>{ if(carrinho.length&&!confirmarSaida()) return; tela={nome:"mesa",mesa:n}; carrinho=[]; render(); };
  const q=semAc(busca);
  const lista=CARD.filter(s=>!secAtiva||s.id===secAtiva);
  let h=`<input class="t" id="busca" type="search" placeholder="Buscar item…" value="${esc(busca)}" style="margin-top:4px">
    <div class="secs"><button data-s="" class="${secAtiva?"":"on"}">Tudo</button>${CARD.map(s=>`<button data-s="${s.id}" class="${secAtiva===s.id?"on":""}">${esc(s.titulo)}</button>`).join("")}</div>`;
  lista.forEach(s=>{
    if(s.tipo==="listas"){
      if(q&&!semAc(s.titulo).includes(q)) return;
      const qc=qtdNoCarrinho("s:"+s.id);
      h+=`<div class="titsec">${esc(s.titulo)}</div><div class="prod" data-sec="${s.id}"><div class="n"><b>${esc(s.titulo)}</b><span>${(s.listas||[]).map(l=>l.opcoes.join(", ")).join(" · ")}</span></div><span class="p">${brl(s.preco)}</span>${qc?`<span class="qc">${qc}</span>`:""}</div>`;
      return;
    }
    const its=s.itens.filter(i=>!q||semAc(i.nome+" "+i.descricao).includes(q));
    if(!its.length) return;
    h+=`<div class="titsec">${esc(s.titulo)}${s.destino==="bar"?" · bar":""}</div>`+its.map(i=>{ const qc=qtdNoCarrinho("i:"+i.id);
      return `<div class="prod" data-it="${i.id}" data-s2="${s.id}"><div class="n"><b>${esc(i.nome)}</b>${i.descricao?`<span>${esc(i.descricao)}</span>`:""}</div><span class="p">${esc(precoTxt(i))}</span>${qc?`<span class="qc">${qc}</span>`:""}</div>`; }).join("");
  });
  $("corpo").innerHTML=h;
  const bu=$("busca"); bu.oninput=()=>{ busca=bu.value; const pos=bu.selectionStart; telaCardapio(); const nb=$("busca"); nb.focus(); try{nb.setSelectionRange(pos,pos);}catch(e){} };
  barraCarrinho();
  $("corpo").onclick=e=>{
    const sbt=e.target.closest(".secs [data-s]"); if(sbt){ secAtiva=sbt.dataset.s||null; telaCardapio(); return; }
    const pi=e.target.closest("[data-it]"); if(pi){ const s=CARD.find(x=>x.id===pi.dataset.s2); abrirItem(s.itens.find(i=>i.id===pi.dataset.it)); return; }
    const ps=e.target.closest("[data-sec]"); if(ps){ abrirListas(CARD.find(x=>x.id===ps.dataset.sec)); }
  };
}
function confirmarSaida(){ return window.confirm("Descartar os itens que ainda não foram enviados?"); }
function barraCarrinho(){
  const qtd=carrinho.reduce((s,c)=>s+c.qtd,0), tot=carrinho.reduce((s,c)=>s+c.qtd*c.preco,0);
  $("barra").classList.toggle("oculto",!qtd);
  $("barra").innerHTML=qtd?`<button class="btn pri" id="bVer">Ver pedido (${qtd}) · ${brl(tot)}</button>`:"";
  if(qtd) $("bVer").onclick=verCarrinho;
}

/* ---------- folha (bottom sheet) ---------- */
function abrirFolha(html,depois){
  $("camada").innerHTML=`<div class="veu" id="veu"></div><div class="folha" id="folha">${html}</div>`;
  $("veu").onclick=fecharFolha; depois&&depois($("folha"));
}
function fecharFolha(){ $("camada").innerHTML=""; }

function abrirItem(i){
  let qtd=1, idx=0, obs="";
  const dois=i.precos.length>1;
  const desenhar=()=>{
    abrirFolha(`<h2>${esc(i.nome)}</h2><div class="sub">${esc(i.descricao||"")}</div>
      ${dois?`<label class="l">Tamanho</label><div class="opcs" id="fTam">${i.precos.map((p,k)=>`<button data-k="${k}" class="${k===idx?"on":""}">${esc(p.rotulo||"Opção "+(k+1))} · ${p.valor==null?"—":brl(p.valor)}</button>`).join("")}</div>`:""}
      <div class="qtd"><button id="fMenos">−</button><b id="fQ">${qtd}</b><button id="fMais">+</button></div>
      <label class="l">Observação</label><div class="opcs" id="fRap">${OBS_RAPIDAS.map(o=>`<button>${o}</button>`).join("")}</div>
      <input class="t" id="fObs" placeholder="Escreva uma observação" value="${esc(obs)}">
      <button class="btn pri bloco" style="margin-top:14px" id="fAdd">Adicionar ${brl((i.precos[idx].valor||0)*qtd)}</button>`,f=>{
        const atual=()=>{ f.querySelector("#fQ").textContent=qtd; f.querySelector("#fAdd").textContent="Adicionar "+brl((i.precos[idx].valor||0)*qtd); };
        f.querySelector("#fMenos").onclick=()=>{ qtd=Math.max(1,qtd-1); atual(); };
        f.querySelector("#fMais").onclick=()=>{ qtd++; atual(); };
        f.querySelector("#fObs").oninput=e=>obs=e.target.value;
        if(dois) f.querySelector("#fTam").onclick=e=>{ const b=e.target.closest("[data-k]"); if(!b) return; idx=+b.dataset.k; obs=f.querySelector("#fObs").value; desenhar(); };
        f.querySelector("#fRap").onclick=e=>{ if(e.target.tagName!=="BUTTON") return; const o=e.target.textContent; const el=f.querySelector("#fObs"); el.value=el.value?el.value+", "+o.toLowerCase():o; obs=el.value; };
        f.querySelector("#fAdd").onclick=()=>{
          obs=f.querySelector("#fObs").value.trim();
          const chave="i:"+i.id+":"+idx+":"+obs;
          const ex=carrinho.find(c=>c.chave===chave);
          if(ex) ex.qtd+=qtd; else carrinho.push({chave,item_id:i.id,nome:i.nome,rotulo:dois?i.precos[idx].rotulo:"",preco:i.precos[idx].valor||0,preco_idx:idx,qtd,obs});
          fecharFolha(); vibrar(30); telaCardapio();
        };
      });
  };
  desenhar();
}
function abrirListas(s){
  let qtd=1, esc1=null, esc2=null, obs="";
  const L=s.listas||[];
  const desenhar=()=>{
    abrirFolha(`<h2>${esc(s.titulo)}</h2><div class="sub">${brl(s.preco)} cada${s.nota?" · "+esc(s.nota):""}</div>
      ${L.map((l,k)=>`<label class="l">${esc(l.titulo)}</label><div class="opcs" data-l="${k}">${l.opcoes.map(o=>`<button class="${(k===0?esc1:esc2)===o?"on":""}">${esc(o)}</button>`).join("")}</div>`).join("")}
      <div class="qtd"><button id="fMenos">−</button><b id="fQ">${qtd}</b><button id="fMais">+</button></div>
      <input class="t" id="fObs" placeholder="Observação (ex: fruta extra, pouco açúcar)" value="${esc(obs)}">
      <button class="btn pri bloco" style="margin-top:14px" id="fAdd">Adicionar</button>`,f=>{
        f.querySelectorAll("[data-l]").forEach(div=>div.onclick=e=>{ if(e.target.tagName!=="BUTTON") return; obs=f.querySelector("#fObs").value; if(div.dataset.l==="0") esc1=e.target.textContent; else esc2=e.target.textContent; desenhar(); });
        f.querySelector("#fMenos").onclick=()=>{ qtd=Math.max(1,qtd-1); f.querySelector("#fQ").textContent=qtd; };
        f.querySelector("#fMais").onclick=()=>{ qtd++; f.querySelector("#fQ").textContent=qtd; };
        f.querySelector("#fAdd").onclick=()=>{
          if(L.length&&!esc1){ aviso("Escolha "+L[0].titulo.toLowerCase(),"erro",2500); return; }
          if(L.length>1&&!esc2){ aviso("Escolha "+L[1].titulo.toLowerCase(),"erro",2500); return; }
          obs=f.querySelector("#fObs").value.trim();
          const nome=s.titulo.replace(/s$/i,"")+" "+[esc1,esc2].filter(Boolean).join(" · ");
          const chave="s:"+s.id+":"+nome+":"+obs; const ex=carrinho.find(c=>c.chave===chave);
          if(ex) ex.qtd+=qtd; else carrinho.push({chave,secao_id:s.id,nome,rotulo:"",preco:s.preco||0,qtd,obs});
          fecharFolha(); vibrar(30); telaCardapio();
        };
      });
  };
  desenhar();
}
function verCarrinho(){
  const desenhar=()=>{
    const tot=carrinho.reduce((s,c)=>s+c.qtd*c.preco,0);
    if(!carrinho.length){ fecharFolha(); telaCardapio(); return; }
    abrirFolha(`<h2>Pedido da mesa ${tela.mesa}</h2><div class="sub">Confira antes de enviar</div>
      ${carrinho.map((c,k)=>`<div class="carr"><div class="n"><b>${esc(c.nome)}</b>${c.rotulo?" ("+esc(c.rotulo)+")":""}${c.obs?`<small>${esc(c.obs)}</small>`:""}<div style="font-size:13px;color:var(--sub)">${brl(c.preco*c.qtd)}</div></div>
        <div class="mini"><button data-k="${k}" data-d="-1">−</button><b>${c.qtd}</b><button data-k="${k}" data-d="1">+</button></div></div>`).join("")}
      <div class="linha" style="font-weight:700;border-top:1px solid var(--borda);margin-top:6px;padding-top:12px"><span>Total deste pedido</span><span>${brl(tot)}</span></div>
      <button class="btn pri bloco" style="margin-top:12px" id="fEnviar">Enviar para cozinha / bar</button>
      <button class="btn bloco" style="margin-top:8px" id="fMais">Continuar escolhendo</button>`,f=>{
        f.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const c=carrinho[+b.dataset.k]; c.qtd+=+b.dataset.d; if(c.qtd<=0) carrinho.splice(+b.dataset.k,1); desenhar(); });
        f.querySelector("#fMais").onclick=()=>{ fecharFolha(); telaCardapio(); };
        f.querySelector("#fEnviar").onclick=enviar;
      });
  };
  desenhar();
}
async function enviar(){
  const b=$("fEnviar"); b.disabled=true; b.textContent="Enviando…";
  const itens=carrinho.map(c=>c.item_id?{item_id:c.item_id,preco_idx:c.preco_idx,qtd:c.qtd,obs:c.obs}:{secao_id:c.secao_id,nome:c.nome,qtd:c.qtd,obs:c.obs});
  const {error}=await sb.rpc("enviar_pedido",{p_mesa:tela.mesa,p_garcom:EU.id,p_itens:itens});
  if(error){ b.disabled=false; b.textContent="Tentar enviar de novo"; aviso(erroMsg(error),"erro",6000); return; }
  carrinho=[]; fecharFolha(); vibrar(60);
  aviso(`Pedido da mesa ${tela.mesa} enviado ✓`,"neutro");
  await carregarMesas(); tela={nome:"mesa",mesa:tela.mesa}; render(); window.scrollTo(0,0);
}

let RESTINFO=null;
async function contaParaImprimir(c){
  if(!RESTINFO){ const {data}=await sb.from("restaurante").select("*").eq("id",1).maybeSingle(); RESTINFO=data||{}; }
  const sub=subtotal(c);
  abrirFolha(`<h2>Imprimir conta · Mesa ${c.mesa}</h2><div class="sub">Consumo ${brl(sub)}</div>
    <label class="linha" style="align-items:center;cursor:pointer"><span>Incluir taxa de serviço (10%)</span><input type="checkbox" id="pTaxa" checked style="width:22px;height:22px"></label>
    <label class="linha" style="align-items:center;cursor:pointer"><span>Dividir a conta</span><select id="pDiv" class="t" style="width:auto;padding:6px">${[1,2,3,4,5,6,8,10].map(n=>`<option value="${n}">${n===1?"não":n+" pessoas"}</option>`).join("")}</select></label>
    <div style="margin:10px 0">${escolherPapelHtml()}</div>
    <p class="dica" style="font-size:13px;color:var(--sub)">Funciona com impressora ligada a este aparelho (Wi-Fi/AirPrint, ou app da impressora térmica no Android).</p>
    <button class="btn pri bloco" id="pImp">🖨️ Imprimir</button>`,f=>{
      f.querySelector("#pImp").onclick=()=>{
        const taxa=f.querySelector("#pTaxa").checked?Math.round(sub*10)/100:0, div=+f.querySelector("#pDiv").value, tot=sub+taxa;
        const itens=c.pedidos.filter(p=>p.status!=="aguardando").flatMap(p=>p.pedido_itens).filter(i=>!i.cancelado);
        // agrupa itens iguais
        const ag=[]; itens.forEach(i=>{ const k=i.nome+"|"+(i.rotulo||"")+"|"+i.preco; const x=ag.find(y=>y.k===k); if(x) x.qtd+=i.qtd; else ag.push({k,qtd:i.qtd,nome:i.nome,rotulo:i.rotulo,preco:i.preco}); });
        const linhas=[["Consumo",brl(sub)]]; if(taxa) linhas.push(["Serviço (10%) opcional",brl(taxa)]);
        const rod=[]; if(div>1) rod.push(`Dividido por ${div}: ${brl(tot/div)} cada`);
        if(RESTINFO.pix_chave) rod.push("Pix: "+RESTINFO.pix_chave);
        const vPix=div>1?Math.round(tot/div*100)/100:tot;
        imprimirConta({titulo:"CONTA · MESA "+c.mesa,sub:[`Garçom: ${EU.nome}`,"Aberta às "+new Date(c.aberta_em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})],itens:ag,linhas,total:tot,rodape:rod,rest:RESTINFO,pix:pixDoRestaurante(RESTINFO,vPix,"MESA"+c.mesa),pixValor:vPix});
        fecharFolha();
      };
    });
}
async function fecharConta(c){
  let taxa=false, forma=null;
  if(!RESTINFO){ const {data}=await sb.from("restaurante").select("*").eq("id",1).maybeSingle(); RESTINFO=data||{}; }
  const sub=subtotal(c);
  const desenhar=()=>{
    const tx=taxa?Math.round(sub*10)/100:0;
    abrirFolha(`<h2>Fechar conta · Mesa ${c.mesa}</h2><div class="sub">Confira com o cliente antes de cobrar</div>
      <div class="linha"><span>Consumo</span><b>${brl(sub)}</b></div>
      <label class="linha" style="align-items:center;cursor:pointer"><span>Taxa de serviço (10%)</span><span><input type="checkbox" id="fTaxa"${taxa?" checked":""} style="width:22px;height:22px;vertical-align:middle"> ${brl(tx)}</span></label>
      <div class="linha" style="font-size:20px;border-top:1px solid var(--borda);padding-top:10px"><span>Total</span><b>${brl(sub+tx)}</b></div>
      <label class="l">Forma de pagamento</label>
      <div class="formas" id="fFormas">${["Dinheiro","Pix","Crédito","Débito"].map(x=>`<button class="${forma===x?"on":""}">${x}</button>`).join("")}</div>
      ${forma==="Pix"?(()=>{ const p=pixDoRestaurante(RESTINFO,sub+tx,"MESA"+c.mesa); return p?`<div style="text-align:center;margin:12px 0">
        <div style="font-size:14px;margin-bottom:6px">Mostre para o cliente: <b>Pix de ${brl(sub+tx)}</b></div>
        <div style="width:220px;height:220px;margin:0 auto;border-radius:10px;overflow:hidden">${pixQrSvg(p)}</div>
        <div class="dica" style="font-size:13px;color:var(--sub);margin-top:6px">O cliente abre o app do banco → Pix → Ler QR code. Confira o recebimento antes de liberar a mesa.</div></div>`:(RESTINFO.pix_chave?`<div class="dica" style="font-size:13px;margin:8px 0">Chave Pix: <b>${esc(RESTINFO.pix_chave)}</b></div>`:""); })():""}
      <button class="btn ok bloco" id="fOk"${forma?"":" disabled"}>Confirmar pagamento e liberar mesa</button>`,f=>{
        f.querySelector("#fTaxa").onchange=e=>{ taxa=e.target.checked; desenhar(); };
        f.querySelector("#fFormas").onclick=e=>{ if(e.target.tagName!=="BUTTON") return; forma=e.target.textContent; desenhar(); };
        f.querySelector("#fOk").onclick=async()=>{
          const b=f.querySelector("#fOk"); b.disabled=true; b.textContent="Fechando…";
          const {error}=await sb.rpc("fechar_conta",{p_comanda:c.id,p_forma:forma,p_taxa:taxa});
          if(error){ aviso(erroMsg(error),"erro",6000); b.disabled=false; b.textContent="Tentar de novo"; return; }
          fecharFolha(); aviso(`Mesa ${c.mesa} liberada ✓`,"neutro"); await carregarMesas(); tela={nome:"mesas"}; render();
        };
      });
  };
  desenhar();
}

/* ---------- Pix com valor (BR Code / "copia e cola", padrão do Banco Central) ---------- */
function pixSemAcento(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 .\-]/g,"").replace(/\s+/g," ").trim(); }
function pixTipoAdivinha(c){
  c=String(c||"").trim(); const d=c.replace(/\D/g,"");
  if(!c) return "";
  if(c.includes("@")) return "email";
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c)) return "aleatoria";
  if(c.startsWith("+")||/[()]/.test(c)) return "telefone";
  if(/^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}$/.test(c)) return "cnpj";
  if(/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(c)) return "cpf";
  if(d.length===10&&d===c.replace(/[\s-]/g,"")) return "telefone";
  return "";
}
function pixChaveNorm(chave,tipo){
  const c=String(chave||"").trim(), d=c.replace(/\D/g,"");
  tipo=tipo||pixTipoAdivinha(c);
  if(tipo==="cpf") return d.length===11?d:"";
  if(tipo==="cnpj") return d.length===14?d:"";
  if(tipo==="telefone"){ const n=(d.startsWith("55")&&d.length>=12)?d:"55"+d; return n.length>=12&&n.length<=13?"+"+n:""; }
  if(tipo==="email") return c.toLowerCase();
  if(tipo==="aleatoria") return c.toLowerCase();
  return "";
}
function pixPayload(o){
  // o = {chave, tipo, nome, cidade, valor, txid}
  const k=pixChaveNorm(o.chave,o.tipo); if(!k) return "";
  const f=(id,v)=>id+String(v.length).padStart(2,"0")+v;
  const tx=String(o.txid||"").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"***";
  const valor=+o.valor>0?(+o.valor).toFixed(2):"";
  let p=f("00","01")+f("26",f("00","br.gov.bcb.pix")+f("01",k))+f("52","0000")+f("53","986")+(valor?f("54",valor):"")+
        f("58","BR")+f("59",(pixSemAcento(o.nome)||"SENOR X").slice(0,25).trim())+f("60",(pixSemAcento(o.cidade)||"BRASIL").slice(0,15).trim())+f("62",f("05",tx))+"6304";
  let crc=0xFFFF;
  for(let i=0;i<p.length;i++){ crc^=p.charCodeAt(i)<<8; for(let j=0;j<8;j++){ crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; } }
  return p+crc.toString(16).toUpperCase().padStart(4,"0");
}
function pixDoRestaurante(r,valor,txid){ return pixPayload({chave:r&&r.pix_chave,tipo:r&&r.pix_tipo,nome:(r&&r.pix_nome)||"Senor X",cidade:r&&r.pix_cidade,valor,txid}); }
function pixQrSvg(texto,cor){
  if(!texto||typeof qrcode==="undefined") return "";
  const q=qrcode(0,"M"); q.addData(texto); q.make(); const n=q.getModuleCount(); let d="";
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) d+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" style="width:100%;height:100%;display:block;background:#fff"><path fill="${cor||"#000"}" d="${d}"/></svg>`;
}
